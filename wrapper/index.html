<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mahlori Invoice">
<title>Mahlori Invoice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#1f4e63;font-family:system-ui,Arial,sans-serif}
  iframe{border:0;display:block;width:100%;height:100%}
  #msg{color:#fff;padding:24px;max-width:480px;margin:auto}
</style>
</head>
<body>
<script>
  // 1) Paste your Apps Script web app URL (ends with /exec) between the quotes:
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwmZ5q9oG4RpKyaPt8HlkELADP5bLz_Im0dDlSnme1hbvCnrDzStzDWTtrufTXB1gyR/exec';

  if (APP_URL.indexOf('https://script.google.com/') !== 0) {
    document.body.innerHTML = '<div id="msg"><h2>Almost there</h2><p>Open <b>index.html</b> in this folder and paste your Apps Script web app URL into <code>APP_URL</code>.</p></div>';
  } else {
    const f = document.createElement('iframe');
    f.src = APP_URL;
    f.allow = 'clipboard-write; downloads';
    f.setAttribute('allowfullscreen', '');
    document.body.appendChild(f);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
